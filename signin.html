<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href = "./style2.css">
    <link rel="icon" href="neticon.ico" type="image/ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <section class="nav">
                <h1>NETFLIX</h1>
                
        </section>
        <hr>
    </header>
    <main>
        <section class="signin">
            <section class="info">
            <h2>Enter your info to sign in</h2>
            <p>Or get started with a new account.</p>
            </section>
            <section class="btn">
                <form>
                <label   for="email"></label>
                <input type="email" class="input" type ="number" id="email" name="name" placeholder="Email or phone number" required>
                </form>
                <button class="continue" type="submit" >Continue</button>
                        
            </section>
            <section class="help">
                <p>Get Help</p>
                <section class="link">
                    <p><a href="#">Forgot email or mobile number?</a></p>
                    <p><a href="#">Learn more about sign-in</a></p>
                </section>
            </section>
            

        </section>
    </main>
    <footer>
        <section>

        </section>
    </footer>
</body>
</html>
